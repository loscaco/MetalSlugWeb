  <style>
    :root {
      --primary-color: #ffcc00;
      --accent-color: #ff3300;
      --bg-dark: #050508;
      --surface-dark: #0d0d14;
      --border-glow: rgba(255, 204, 0, 0.35);
      --font-stack: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: var(--font-stack);
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: grid;
      grid-template-rows: auto 1fr auto;
      align-items: center;
      justify-items: center;
      padding: 8px;
    }

    /* Header Cyberpunk / Arcade */
    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 14px;
      background: var(--surface-dark);
      border: 1px solid rgba(255, 204, 0, 0.15);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-logo {
      width: 10px;
      height: 10px;
      background: var(--primary-color);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--primary-color);
    }

    h1 {
      font-size: clamp(0.85rem, 2vw, 1.1rem);
      letter-spacing: 2px;
      color: var(--primary-color);
      text-transform: uppercase;
      font-weight: 800;
    }

    .telemetry-bar {
      display: flex;
      gap: 12px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #888;
    }

    .telemetry-item span {
      color: #00ffcc;
      font-weight: bold;
    }

    /* Contenedor Principal Arcade 4:3 */
    #arcade-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      max-height: 78vh;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 2px solid #222;
      border-radius: 10px;
      box-shadow: 0 0 35px var(--border-glow), 0 0 80px rgba(0, 0, 0, 0.9);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-canvas-target {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #game-canvas-target iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
    }

    /* Overlay Scanlines CRT */
    #crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 50;
      background: linear-gradient(
        rgba(18, 16, 16, 0) 50%, 
        rgba(0, 0, 0, 0.2) 50%
      );
      background-size: 100% 3px;
      opacity: 0.6;
    }

    /* Splash Screen Interactivo (Solución de Audio Autoplay) */
    #hero-splash {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, #151520 0%, #050508 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.4s ease;
    }

    .arcade-btn-main {
      padding: 14px 32px;
      font-size: clamp(0.9rem, 2.5vw, 1.3rem);
      font-weight: 900;
      color: var(--bg-dark);
      background: var(--primary-color);
      border: none;
      border-radius: 6px;
      text-transform: uppercase;
      letter-spacing: 3px;
      box-shadow: 0 0 25px var(--primary-color);
      animation: pulse-glow 1.5s infinite alternate;
      cursor: pointer;
    }

    @keyframes pulse-glow {
      from { transform: scale(1); box-shadow: 0 0 15px var(--primary-color); }
      to { transform: scale(1.03); box-shadow: 0 0 30px var(--primary-color), 0 0 45px var(--accent-color); }
    }

    /* Footer / Controles UI */
    footer {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      color: #666;
      padding: 4px 6px;
    }

    .key-badge {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      color: #eee;
      padding: 2px 5px;
      border-radius: 4px;
      font-family: monospace;
    }
  </style>
</head>
