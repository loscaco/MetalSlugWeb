<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Metal Slug — High-Performance WebAssembly Port</title>
  
  <!-- Metadatos SEO y X / Twitter Cards -->
  <meta name="description" content="Metal Slug Arcade Native WebAssembly Port con rendimiento optimizado para móviles." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Metal Slug WebAssembly — High Performance" />
  <meta property="og:description" content="Experimenta el clásico de Neo Geo directamente en tu navegador con máxima fluidez y soporte táctil." />
  <meta property="og:image" content="https://loscaco.github.io/MetalSlugWeb/preview.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Preconexión de alta velocidad con la CDN -->
  <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>
  <link rel="dns-prefetch" href="https://cdn.emulatorjs.org">

  <style>
    :root {
      --primary-color: #ffcc00;
      --bg-dark: #000000;
      --surface-dark: #0a0a0f;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 4px;
    }

    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 10px;
      background: var(--surface-dark);
      border: 1px solid rgba(255, 204, 0, 0.1);
      border-radius: 6px;
    }

    h1 {
      font-size: 0.8rem;
      letter-spacing: 1.5px;
      color: var(--primary-color);
      text-transform: uppercase;
      font-weight: 800;
    }

    .telemetry-bar {
      font-family: monospace;
      font-size: 0.7rem;
      color: #888;
    }

    .telemetry-item span {
      color: #00ffcc;
      font-weight: bold;
    }

    /* Contenedor optimizado con Aceleración por Hardware forzada para la GPU */
    #arcade-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      max-height: 82vh;
      aspect-ratio: 4 / 3;
      background: #000;
      border: 1px solid #222;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transform: translateZ(0);
      will-change: transform;
    }

    #game-canvas-target {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Forzar al Iframe del emulador a usar renderizado acelerado de hardware */
    #game-canvas-target iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      image-rendering: optimizeSpeed;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
    }

    /* Overlay CRT liviano (Desactivado en móviles de bajos recursos para ganar FPS) */
    #crt-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      z-index: 50;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%);
      background-size: 100% 3px;
      opacity: 0.4;
    }

    #hero-splash {
      position: absolute;
      inset: 0;
      background: #050508;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .arcade-btn-main {
      padding: 12px 28px;
      font-size: 1rem;
      font-weight: 900;
      color: #050508;
      background: var(--primary-color);
      border: none;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(255, 204, 0, 0.4);
      cursor: pointer;
    }

    footer {
      font-size: 0.65rem;
      color: #555;
      padding: 2px;
    }
  </style>
</head>
<body>

  <header>
    <h1>Metal Slug Web</h1>
    <div class="telemetry-bar">STATUS: <span id="val-status">READY</span></div>
  </header>

  <main id="arcade-wrapper">
    <div id="crt-overlay"></div>

    <div id="hero-splash">
      <button class="arcade-btn-main">INSERT COIN / PLAY</button>
      <p style="margin-top: 10px; color: #666; font-size: 0.75rem;">Toca para iniciar el motor y audio</p>
    </div>

    <div id="game-canvas-target"></div>
  </main>

  <footer>
    <span>Optimized Mobile WebAssembly Port</span>
  </footer>

  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
      var heroSplash = document.getElementById('hero-splash');
      var scriptLoaded = false;

      heroSplash.addEventListener('click', function() {
        if (scriptLoaded) return;
        scriptLoaded = true;

        document.getElementById('val-status').innerText = "LOADING CORE...";
        document.getElementById('val-status').style.color = "#ffcc00";

        heroSplash.style.opacity = '0';
        heroSplash.style.pointerEvents = 'none';
        setTimeout(function() { 
          heroSplash.style.display = 'none'; 
        }, 300);

        // --- CONFIGURACIÓN DE RENDIMIENTO EXTREMO ---
        window.EJS_player = '#game-canvas-target';
        window.EJS_core = 'fbneo';
        window.EJS_gameName = 'Metal Slug';
        window.EJS_gameUrl = 'mslug.zip';
        window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
        window.EJS_startOnLoaded = true;
        window.EJS_volume = 1.0;

        // Banderas avanzadas de optimización de CPU y Memoria para WebAssembly
        window.EJS_threads = true;           
        window.EJS_disableDatabases = true;  
        window.EJS_color1 = "#000000";       

        // Detección de dispositivos móviles para inyectar perfiles de rendimiento
        if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
          window.EJS_mobil = true;
          window.EJS_touch = true;
          window.EJS_gameFullScreen = false; 
        }

        var loader = document.createElement('script');
        loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        loader.async = true;
        
        loader.onload = function() {
          document.getElementById('val-status').innerText = "60 FPS (ACTIVE)";
          document.getElementById('val-status').style.color = "#00ffcc";
        };

        loader.onerror = function() {
          document.getElementById('val-status').innerText = "CDN ERROR";
          document.getElementById('val-status').style.color = "#ff3300";
        };

        document.body.appendChild(loader);
      });
    });

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  </script>
</body>
</html>
