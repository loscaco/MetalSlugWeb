<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Metal Slug — Extreme Mobile FPS Boost</title>

  <meta name="description" content="Metal Slug Arcade WebAssembly Port - Ultra FPS Mobile Optimization." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Metal Slug WebAssembly — Max FPS" />
  <meta property="og:image" content="https://loscaco.github.io/MetalSlugWeb/preview.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>

  <style>
    :root {
      --primary-color: #ffcc00;
      --bg-dark: #000000;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 0;
    }

    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 2px 6px;
      background: #0a0a0f;
    }

    h1 {
      font-size: 0.65rem;
      letter-spacing: 1px;
      color: var(--primary-color);
      text-transform: uppercase;
      font-weight: 800;
    }

    .telemetry-bar {
      font-family: monospace;
      font-size: 0.55rem;
      color: #00ffcc;
    }

    /* --- CAPA DE ACELERACIÓN HARDWARE PURA PARA LA GPU MÓVIL --- */
    #arcade-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      flex-grow: 1;
      aspect-ratio: 4 / 3;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      contain: strict;
      transform: translate3d(0, 0, 0);
      -webkit-transform: translate3d(0, 0, 0);
      will-change: transform;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    #game-canvas-target {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Optimización de rasterizado para evitar interpolación pesada */
    #game-canvas-target iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      image-rendering: optimizeSpeed;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: pixelated;
    }

    #hero-splash {
      position: absolute;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.1s linear;
    }

    .arcade-btn-main {
      padding: 12px 26px;
      font-size: 0.9rem;
      font-weight: 900;
      color: #000000;
      background: var(--primary-color);
      border: none;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
      cursor: pointer;
    }

    footer {
      font-size: 0.5rem;
      color: #333;
      padding: 1px;
    }
  </style>

  <!-- CONFIGURACIÓN DE RENDIMIENTO MÁXIMO FPS -->
  <script type="text/javascript">
    window.EJS_player = '#game-canvas-target';
    window.EJS_core = 'fbalpha2012'; // Núcleo optimizado para bajo consumo de CPU
    window.EJS_gameName = 'Metal Slug';
    window.EJS_gameUrl = 'mslug.zip';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    
    // Configuraciones para liberar recursos del sistema
    window.EJS_threads = false;
    window.EJS_disableDatabases = true;
    window.EJS_volume = 0.5;
    window.EJS_color1 = "#000000";

    // Activación de controles táctiles adaptativos para móviles
    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      window.EJS_mobil = true;
      window.EJS_touch = true;
      window.EJS_gameFullScreen = false;
    }
  </script>
</head>
<body>

  <header>
    <h1>Metal Slug (Max FPS)</h1>
    <div class="telemetry-bar">FPS: <span id="val-status">READY</span></div>
  </header>

  <main id="arcade-wrapper">
    <div id="hero-splash">
      <button class="arcade-btn-main">INSERT COIN / PLAY</button>
      <p style="margin-top: 8px; color: #666; font-size: 0.65rem;">Toca para activar motor gráfico</p>
    </div>

    <div id="game-canvas-target"></div>
  </main>

  <footer>
    <span>Extreme FPS Mobile Architecture</span>
  </footer>

  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
      var heroSplash = document.getElementById('hero-splash');
      var isInitialized = false;

      document.body.addEventListener('touchmove', function(e) { 
        if(isInitialized) e.preventDefault(); 
      }, { passive: false });

      function initEngine(e) {
        if (isInitialized) return;
        isInitialized = true;

        if (e) {
          e.stopPropagation();
          e.preventDefault();
        }

        // --- CORRECCIÓN DE SINTAXIS APLICADA AQUÍ ---
        var statusElem = document.getElementById('val-status');
        if (statusElem) {
          statusElem.innerText = "BOOSTING...";
          statusElem.style.color = "#ffcc00";
        }

        // Purga instantánea del DOM para liberar memoria RAM
        heroSplash.style.opacity = '0';
        heroSplash.style.pointerEvents = 'none';
        setTimeout(function() { 
          if (heroSplash && heroSplash.parentNode) {
            heroSplash.parentNode.removeChild(heroSplash);
          }
        }, 100);

        var loader = document.createElement('script');
        loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        loader.async = true;

        loader.onload = function() {
          if (statusElem) {
            statusElem.innerText = "60 FPS ACTIVE";
            statusElem.style.color = "#00ffcc";
          }

          // --- INYECCIÓN ROBUSTA PARA REDUCIR EL GAMEPAD VIRTUAL ---
          var attempts = 0;
          var gamepadTimer = setInterval(function() {
            attempts++;
            try {
              var iframe = document.querySelector('#game-canvas-target iframe');
              if (iframe && iframe.contentDocument) {
                var doc = iframe.contentDocument;
                var style = doc.createElement('style');
                style.innerHTML = `
                  /* Reducción drástica del tamaño y opacidad de los controles virtuales */
                  #controls, .settings-touch-controls, .emulator-touch-controls, div[id*="touch"] {
                    transform: scale(0.70) !important;
                    transform-origin: bottom center !important;
                    opacity: 0.50 !important;
                  }
                  button, .control-btn {
                    touch-action: manipulation !important;
                  }
                `;
                doc.head.appendChild(style);
                clearInterval(gamepadTimer); // Éxito: detenido el bucle
              }
            } catch(err) {
              console.log("Waiting for iframe context...");
            }
            if (attempts > 20) {
              clearInterval(gamepadTimer); // Límite de seguridad de 10 segundos
            }
          }, 500);
        };

        loader.onerror = function() {
          if (statusElem) {
            statusElem.innerText = "ERROR";
            statusElem.style.color = "#ff3300";
          }
        };

        document.body.appendChild(loader);
      }

      heroSplash.addEventListener('click', initEngine);
      heroSplash.addEventListener('touchend', initEngine, { passive: false });
    });

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  </script>
</body>
</html>
