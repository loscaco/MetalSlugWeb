<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Metal Slug — Ultimate Production Port</title>

  <meta name="description" content="Metal Slug Arcade WebAssembly Port optimizado para móviles." />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Metal Slug WebAssembly" />
  <meta property="og:image" content="https://loscaco.github.io/MetalSlugWeb/preview.jpg" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://cdn.emulatorjs.org" crossorigin>

  <style>
    :root {
      --primary-color: #ffcc00;
      --bg-dark: #000000;
    }

    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg-dark);
      color: #ffffff;
      font-family: system-ui, -apple-system, sans-serif;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2px;
    }

    header {
      width: 100%;
      max-width: 960px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 8px;
      background: #0a0a0f;
      border-bottom: 1px solid rgba(255, 204, 0, 0.1);
    }

    h1 {
      font-size: 0.75rem;
      letter-spacing: 1px;
      color: var(--primary-color);
      text-transform: uppercase;
      font-weight: 800;
    }

    .telemetry-bar {
      font-family: monospace;
      font-size: 0.65rem;
      color: #888;
    }

    #arcade-wrapper {
      position: relative;
      width: 100%;
      max-width: 960px;
      max-height: 85vh;
      aspect-ratio: 4 / 3;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      contain: strict;
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    #game-canvas-target {
      width: 100%;
      height: 100%;
      position: relative;
    }

    #game-canvas-target iframe {
      width: 100% !important;
      height: 100% !important;
      border: none;
      image-rendering: pixelated;
    }

    #hero-splash {
      position: absolute;
      inset: 0;
      background: #000000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
      cursor: pointer;
      transition: opacity 0.2s ease-out;
    }

    .arcade-btn-main {
      padding: 12px 26px;
      font-size: 0.95rem;
      font-weight: 900;
      color: #000000;
      background: var(--primary-color);
      border: none;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
      cursor: pointer;
    }

    footer {
      font-size: 0.6rem;
      color: #444;
      padding: 2px;
    }
  </style>

  <!-- CONFIGURACIÓN GLOBAL PREVENTIVA ANTES DE CARGAR NINGÚN SCRIPT -->
  <script type="text/javascript">
    window.EJS_player = '#game-canvas-target';
    window.EJS_core = 'fbneo';
    window.EJS_gameName = 'Metal Slug';
    window.EJS_gameUrl = 'mslug.zip';
    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
    window.EJS_startOnLoaded = true;
    
    // Blindaje de estabilidad contra errores de hilos y almacenamiento local
    window.EJS_threads = false;
    window.EJS_disableDatabases = true;
    window.EJS_volume = 0.5;
    window.EJS_color1 = "#000000";

    if (/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent)) {
      window.EJS_mobil = true;
      window.EJS_touch = true;
      window.EJS_gameFullScreen = false;
    }
  </script>
</head>
<body>

  <header>
    <h1>Metal Slug Web</h1>
    <div class="telemetry-bar">STATUS: <span id="val-status" style="color: #888;">READY</span></div>
  </header>

  <main id="arcade-wrapper">
    <div id="hero-splash">
      <button class="arcade-btn-main">INSERT COIN / PLAY</button>
      <p style="margin-top: 8px; color: #666; font-size: 0.7rem;">Toca para iniciar el juego</p>
    </div>

    <div id="game-canvas-target"></div>
  </main>

  <footer>
    <span>Stable Production Build</span>
  </footer>

  <script type="text/javascript">
    document.addEventListener('DOMContentLoaded', function() {
      var heroSplash = document.getElementById('hero-splash');
      var isInitialized = false;

      document.body.addEventListener('touchmove', function(e) { 
        if(isInitialized) e.preventDefault(); 
      }, { passive: false });

      function initEngine(e) {
        if (isInitialized) return;
        isInitialized = true;

        if (e) {
          e.stopPropagation();
          e.preventDefault();
        }

        document.getElementById('val-status').innerText = "LOADING CORE...";
        document.getElementById('val-status').style.color = "#ffcc00";

        heroSplash.style.opacity = '0';
        heroSplash.style.pointerEvents = 'none';
        setTimeout(function() { 
          if (heroSplash && heroSplash.parentNode) {
            heroSplash.parentNode.removeChild(heroSplash);
          }
        }, 200);

        // Inyección controlada del cargador oficial
        var loader = document.createElement('script');
        loader.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
        loader.async = true;

        loader.onload = function() {
          document.getElementById('val-status').innerText = "RUNNING (60 FPS)";
          document.getElementById('val-status').style.color = "#00ffcc";
        };

        loader.onerror = function() {
          document.getElementById('val-status').innerText = "LOAD ERROR";
          document.getElementById('val-status').style.color = "#ff3300";
          alert("Error al conectar con la CDN del emulador.");
        };

        document.body.appendChild(loader);
      }

      heroSplash.addEventListener('click', initEngine);
      heroSplash.addEventListener('touchend', initEngine, { passive: false });
    });

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });
  </script>
</body>
</html>
